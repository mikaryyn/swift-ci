format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
workflows:
  fixture:
    steps:
    - path::./steps/pass:
        title: Passing step
    - path::./steps/skipped:
        title: Skipped step
        run_if: "false"
    - path::./steps/fail:
        title: Failing step
  passing:
    steps:
    - path::./steps/pass:
        title: Passing step
